<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Sun / Dawn Circle -->
  <circle cx="340" cy="180" r="60" fill="url(#sunGrad)" opacity="0.9"/>
  <!-- Plant Sprout / Stalk -->
  <path d="M 256 390 C 256 310 256 250 256 200" stroke="#f0fdf4" stroke-width="24" stroke-linecap="round"/>
  <!-- Left Sprout Leaf -->
  <path d="M 256 300 C 180 290 140 230 150 170 C 210 170 250 240 256 300 Z" fill="url(#leafGrad)"/>
  <!-- Right Sprout Leaf -->
  <path d="M 256 240 C 330 220 370 160 360 110 C 300 110 260 180 256 240 Z" fill="#4ade80"/>
  <!-- Soil base arc -->
  <path d="M 160 410 Q 256 430 352 410" stroke="#ca8a04" stroke-width="16" stroke-linecap="round"/>
</svg>
